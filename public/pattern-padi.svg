<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120' fill='none'>
  <defs>
    <!-- Lucide Vegan Motif -->
    <g id='vegan-motif'>
      <g transform='translate(-12, -12)'>
        <!-- Outer circular embrace / leaf outline -->
        <path d='M17.41 3.6a10 10 0 1 0 3 3' stroke='white' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/>
        <!-- Sprouting leaf -->
        <path d='M16 8c4 0 6-2 6-6-4 0-6 2-6 6' fill='white' fill-opacity='0.15' stroke='white' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/>
        <!-- Main stem -->
        <path d='M2 2a26.6 26.6 0 0 1 10 20c.9-6.82 1.5-9.5 4-14' stroke='white' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/>
      </g>
    </g>
    <!-- Small Leaf Bud Accent -->
    <g id='leaf-accent'>
      <path d='M0 4 C3 1 4 -3 0 -5 C-4 -3 -3 1 0 4 Z' fill='white' fill-opacity='0.18' stroke='white' stroke-width='1'/>
    </g>
  </defs>

  <!-- Center Motif -->
  <g transform='translate(60, 60) scale(1.5)'>
    <use href='#vegan-motif'/>
  </g>

  <!-- 4 Corner Motifs (Seamless Wrap) -->
  <g transform='translate(0, 0) scale(1.5)'>
    <use href='#vegan-motif'/>
  </g>
  <g transform='translate(120, 0) scale(1.5)'>
    <use href='#vegan-motif'/>
  </g>
  <g transform='translate(0, 120) scale(1.5)'>
    <use href='#vegan-motif'/>
  </g>
  <g transform='translate(120, 120) scale(1.5)'>
    <use href='#vegan-motif'/>
  </g>

  <!-- Subtle Accents in Between -->
  <g transform='translate(60, 12) rotate(30) scale(0.8)'>
    <use href='#leaf-accent'/>
  </g>
  <g transform='translate(60, 108) rotate(-30) scale(0.8)'>
    <use href='#leaf-accent'/>
  </g>
  <g transform='translate(12, 60) rotate(-45) scale(0.8)'>
    <use href='#leaf-accent'/>
  </g>
  <g transform='translate(108, 60) rotate(45) scale(0.8)'>
    <use href='#leaf-accent'/>
  </g>
</svg>