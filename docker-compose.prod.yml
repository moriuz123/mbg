services:

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}

    restart: unless-stopped

    ports:
      - "127.0.0.1:3200:3000"

    volumes:
      - /home/admin_sdsuci/uploads:/app/public/uploads

    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/mbg

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}

      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}

      REDIS_URL: redis://redis:6379

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - mbg_internal


  db:
    image: postgres:15-alpine

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mbg

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mbg"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - mbg_internal


  redis:
    image: redis:7-alpine

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    networks:
      - mbg_internal


volumes:
  postgres_data:
  redis_data:


networks:
  mbg_internal:
    driver: bridge
